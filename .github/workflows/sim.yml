name: Prüfen mit echten Daten

# Nur von Hand: spielt Hit-Mix und Suche mit dem echten Server-Stand durch (Last wie ein einziges Handy)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Wie lange der Mix laufen soll (Minuten)"
        default: "30"

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Regeln der App übernehmen
        run: |
          mkdir -p tools/sim/src/app
          cp app/src/main/java/de/gamingdoodz/radiofinder/MixLogic.kt app/src/main/java/de/gamingdoodz/radiofinder/Text.kt tools/sim/src/app/
      - name: Durchspielen
        working-directory: tools/sim
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
        run: gradle run -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bericht, path: tools/sim/bericht.md }
