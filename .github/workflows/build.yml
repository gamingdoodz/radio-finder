name: App bauen

on:
  push:
    branches: [main]
    paths-ignore: ["server/**", "README.md", "docs/**", "**/*.md", "alexa/**", "config/**"]
  workflow_dispatch:
  # Google erlaubt nur wenige Uploads pro Tag: nachts automatisch die neueste Version hochladen
  schedule:
    - cron: "17 8 * * *"   # 9:17 Uhr: nach dem Zurücksetzen des Google-Tageslimits (Mitternacht US-Westküste)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Upload-Schlüssel bereitstellen (falls hinterlegt)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            # Kopierfehler abfangen: Leerzeichen/Umbrüche, mitkopierte Überschrift
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
            CLEAN=$(printf '%s\n' "$PW" | tr -d '\r' | grep -v 'UPLOAD_KEYSTORE_PASSWORD' | tr -d ' ' | grep -v '^$' | tail -1)
            echo "::add-mask::$CLEAN"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "UPLOAD_KEYSTORE_PASSWORD=$CLEAN" >> "$GITHUB_ENV"
          else
            # Ohne Upload-Schlüssel nichts veröffentlichen (es gibt keinen Ersatz-Schlüssel mehr)
            echo "::error::Upload-Schlüssel (UPLOAD_KEYSTORE_B64) fehlt in den Secrets"
            exit 1
          fi

      - name: APK und Store-Paket bauen
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 16-KB-Speicherseiten prüfen (Pflicht bei Google Play)
        run: |
          ZA=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          if "$ZA" -c -P 16 4 app/build/outputs/apk/release/app-release.apk; then echo "16 KB: ok"; else echo "::warning::APK ist nicht 16-KB-ausgerichtet"; "$ZA" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk | grep -i "lib/" | grep -iv "OK" | head -20 || true; fi

      - name: Dateien umbenennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk Hitradar.apk
          cp app/build/outputs/bundle/release/app-release.aab Hitradar-PlayStore.aab

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hitradar ${{ github.run_number }}
          files: |
            Hitradar.apk
            Hitradar-PlayStore.aab
          make_latest: true

      # Automatisch in den internen Play-Test hochladen (sobald der Schlüssel hinterlegt ist)
      # Hochladen nur nachts, von Hand oder wenn die Änderung "[play]" enthält (Tageslimit bei Google)
      - name: In Google Play hochladen (interner + geschlossener Test)
        if: ${{ env.PLAY_JSON != '' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[play]')) }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.gamingdoodz.hitradar
          releaseFiles: Hitradar-PlayStore.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          tracks: internal,alpha
          status: completed
