name: Server aktualisieren

on:
  push:
    branches: [main]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Läuft erst, wenn die Secrets SERVER_HOST und SERVER_KEY eingetragen sind
    if: ${{ vars.SERVER_READY == 'yes' }}
    steps:
      - name: Auf dem Server aktualisieren
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          script: bash ~/radio-finder/server/update.sh
