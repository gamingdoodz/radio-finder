name: Prüfregel Geheimnisse

# Server-Skripte und Workflows dürfen keine Passwörter, Tokens oder Schlüssel ausgeben
on:
  push:
    paths: ["server/**", ".github/**"]
  pull_request:
    paths: ["server/**", ".github/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verbotene Befehle suchen
        run: bash .github/scripts/check-secrets-rule.sh
      - name: Filter funktioniert
        run: |
          out=$(printf 'A_PASSWORD=x1y2z3w4v5\nghp_abcdefghijklmnopqrstuvwx\n' | python3 .github/scripts/redact.py)
          echo "$out" | grep -q 'x1y2z3' && { echo "Filter lässt Passwort durch"; exit 1; }
          echo "$out" | grep -q 'abcdefghijkl' && { echo "Filter lässt Token durch"; exit 1; }
          echo "Filter ok"
