name: Server überwachen

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/monitor.yml"]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Server prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ok=0
          for i in 1 2 3; do
            r=$(curl -s -m 15 https://130-61-78-232.sslip.io:8080/health || curl -s -m 15 http://130.61.78.232/health || true)
            echo "Antwort: $r"
            if echo "$r" | grep -q '"ok": true'; then ok=1; break; fi
            sleep 60
          done
          open=$(gh issue list -R "$REPO" --state open --search "Server nicht erreichbar in:title" --json number --jq '.[0].number')
          if [ "$ok" = 1 ]; then
            echo "Server läuft."
            # Datenvolumen: Oracle gibt 10 TB im Monat frei, ab 9 TB warnen
            gb=$(echo "$r" | grep -o '"traffic_gb": [0-9.]*' | grep -o '[0-9.]*$' || echo 0)
            echo "Datenvolumen diesen Monat: ${gb:-0} GB"
            warn=$(gh issue list -R "$REPO" --state open --search "Datenvolumen in:title" --json number --jq '.[0].number')
            if [ "$(echo "${gb:-0} >= 9000" | bc)" = 1 ]; then
              [ -z "$warn" ] && gh issue create -R "$REPO" --title "Datenvolumen fast aufgebraucht" \
                --body "Der Server hat diesen Monat schon ${gb} GB gesendet (frei sind 10.000 GB). Die Weiterleitung fürs Casten ist ab 8.000 GB automatisch pausiert. Am Monatsanfang geht es von selbst wieder."
            elif [ -n "$warn" ] && [ "$(echo "${gb:-0} < 8000" | bc)" = 1 ]; then
              gh issue close "$warn" -R "$REPO" -c "Neuer Monat, Datenvolumen wieder frei ✅"
            fi
            if [ -n "$open" ]; then gh issue close "$open" -R "$REPO" -c "Server läuft wieder ✅"; fi
          else
            echo "Server antwortet nicht!"
            if [ -z "$open" ]; then
              gh issue create -R "$REPO" --title "Server nicht erreichbar" \
                --body "Der Hitradar-Server (130.61.78.232) antwortet seit mehreren Minuten nicht. Die App sucht in der Zeit selbst weiter. Tipp: In der Oracle-Konsole die Instanz 'radar' neu starten."
            fi
            exit 1
          fi
